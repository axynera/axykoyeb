<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Koyeb Full Terminal + Wrangler + ChatGPT MCP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <style>
        body, html { width: 100%; height: 100%; margin: 0; background-color: #0d1117; overflow: hidden; }
        #terminal-container { width: 100%; height: calc(100% - 40px); }
        .top-bar { height: 40px; background: #161b22; color: #c9d1d9; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-family: monospace; font-size: 13px; border-bottom: 1px solid #30363d; }
        .logout-btn { background: #da3633; color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .logout-btn:hover { background: #b62324; }
    </style>
</head>
<body>
    <div class="top-bar">
        <span>🚀 Full Terminal (Wrangler Link + GitHub + ChatGPT MCP OAuth)</span>
        <a href="/logout"><button class="logout-btn">Logout</button></a>
    </div>
    <div id="terminal-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const term = new Terminal({ 
            cursorBlink: true, 
            macOptionIsMeta: true, 
            theme: { background: '#0d1117', foreground: '#c9d1d9', cursor: '#58a6ff' } 
        });
        const fitAddon = new FitAddon.FitAddon();
        
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        term.onData(data => socket.emit('input', data));
        socket.on('output', data => term.write(data));

        window.addEventListener('resize', () => fitAddon.fit());
    </script>
</body>
</html>
